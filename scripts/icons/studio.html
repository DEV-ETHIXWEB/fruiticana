<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!--
  Fruiticana 3D icon studio. Every icon is modelled here from hand-drawn
  vector shapes, extruded with rounded bevels and lit like a product shot.
  Rendered by scripts/icons/build.mjs (Playwright) into public/icons3d/*.png.
-->
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const SIZE = 512;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NeutralToneMapping; // Khronos PBR Neutral: keeps brand colours true
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const key = new THREE.DirectionalLight(0xfff4e0, 2.6);
key.position.set(-160, 220, 260);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffe7b8, 1.1);
rim.position.set(220, 60, -120);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xfff8ec, 0x2a3b2f, 0.55));

const camera = new THREE.PerspectiveCamera(26, 1, 1, 3000);
camera.position.set(0, 0, 520);

/* ---------- brand materials (glossy clay with clear coat) ---------- */
const C = {
  chili: 0xe2231a, chiliDeep: 0xb5170f, leaf: 0x1d9a4f, leafLight: 0x3fbf6a, forest: 0x0f3b26,
  turmeric: 0xf6c51c, mango: 0xf39a1e, cream: 0xfbf3e2, brass: 0xc9993f, white: 0xffffff,
};
const mat = (color, o = {}) =>
  new THREE.MeshPhysicalMaterial({ color, roughness: 0.38, metalness: 0, clearcoat: 0.8, clearcoatRoughness: 0.22, ...o });
/** Vertical colour gradient baked into vertex colours (e.g. a ripening mango). */
const gradient = (geo, stops) => {
  geo.computeBoundingBox();
  const { min, max } = geo.boundingBox, pos = geo.attributes.position, cols = new Float32Array(pos.count * 3);
  const cs = stops.map(([t, hex]) => [t, new THREE.Color(hex)]);
  for (let i = 0; i < pos.count; i++) {
    const t = (pos.getY(i) - min.y) / (max.y - min.y || 1) * 0.75 + (pos.getX(i) - min.x) / (max.x - min.x || 1) * 0.25;
    let a = cs[0], b = cs[cs.length - 1];
    for (let k = 0; k < cs.length - 1; k++) if (t >= cs[k][0] && t <= cs[k + 1][0]) { a = cs[k]; b = cs[k + 1]; break; }
    const c = a[1].clone().lerp(b[1], (t - a[0]) / (b[0] - a[0] || 1));
    cols.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute("color", new THREE.BufferAttribute(cols, 3));
  return geo;
};
const metal = (color) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.28, metalness: 0.85, clearcoat: 0.6, clearcoatRoughness: 0.2 });

/* ---------- geometry helpers ---------- */
const extrude = (shape, depth = 18, bevel = 4) =>
  new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.85, bevelSegments: 10, curveSegments: 48 });
const part = (shape, material, { depth = 18, bevel = 4, z = 0 } = {}) => {
  const m = new THREE.Mesh(extrude(shape, depth, bevel), material);
  m.position.z = z;
  return m;
};
const circle = (r, cx = 0, cy = 0) => { const s = new THREE.Shape(); s.absarc(cx, cy, r, 0, Math.PI * 2, false); return s; };
const holeCircle = (r, cx = 0, cy = 0) => { const p = new THREE.Path(); p.absarc(cx, cy, r, 0, Math.PI * 2, true); return p; };
const rrect = (w, h, r, cx = 0, cy = 0) => {
  const s = new THREE.Shape(), x = cx - w / 2, y = cy - h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
};
const sphere = (r, material, x, y, z) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 32), material); m.position.set(x, y, z); return m; };
const cyl = (r, h, material, x, y, z, rotX = Math.PI / 2) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 48), material); m.rotation.x = rotX; m.position.set(x, y, z); return m;
};

/* ---------- the icon models ---------- */
const ICONS = {
  pin() {
    const g = new THREE.Group();
    const s = new THREE.Shape();
    s.moveTo(0, -48);
    s.bezierCurveTo(-10, -30, -34, -6, -34, 14);
    s.bezierCurveTo(-34, 34, -18, 48, 0, 48);
    s.bezierCurveTo(18, 48, 34, 34, 34, 14);
    s.bezierCurveTo(34, -6, 10, -30, 0, -48);
    s.holes.push(holeCircle(13, 0, 15));
    g.add(part(s, mat(C.chili), { depth: 20, bevel: 6 }));
    g.add(part(circle(13.5, 0, 15), mat(C.cream), { depth: 12, bevel: 3, z: 6 }));
    return g;
  },
  flyer() {
    const g = new THREE.Group();
    const s = new THREE.Shape();
    s.moveTo(-34, -46); s.lineTo(34, -46); s.lineTo(34, 26); s.lineTo(14, 46); s.lineTo(-34, 46); s.lineTo(-34, -46);
    g.add(part(s, mat(C.cream), { depth: 10, bevel: 4 }));
    const fold = new THREE.Shape(); fold.moveTo(14, 46); fold.lineTo(14, 26); fold.lineTo(34, 26); fold.lineTo(14, 46);
    g.add(part(fold, mat(C.turmeric), { depth: 6, bevel: 2, z: 10 }));
    g.add(part(rrect(52, 14, 5, -6, 28), mat(C.leaf), { depth: 5, bevel: 2, z: 12 }));
    g.add(part(rrect(52, 7, 3.5, 0, 6), mat(C.forest), { depth: 4, bevel: 1.5, z: 12 }));
    g.add(part(rrect(38, 7, 3.5, -7, -8), mat(C.forest), { depth: 4, bevel: 1.5, z: 12 }));
    // price sticker
    const star = new THREE.Shape(); const n = 14;
    for (let i = 0; i <= n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2; const r = i % 2 ? 17 : 20; const x = 22 + Math.cos(a) * r, y = -30 + Math.sin(a) * r; i ? star.lineTo(x, y) : star.moveTo(x, y); }
    g.add(part(star, mat(C.chili), { depth: 6, bevel: 2.5, z: 14 }));
    return g;
  },
  leaf() {
    const g = new THREE.Group();
    const s = new THREE.Shape();
    s.moveTo(0, -46); s.bezierCurveTo(-36, -24, -36, 26, 0, 48); s.bezierCurveTo(36, 26, 36, -24, 0, -46);
    const l = part(s, mat(C.leaf), { depth: 16, bevel: 6 });
    g.add(l);
    const vein = new THREE.Shape(); vein.moveTo(-2, -38); vein.bezierCurveTo(-4, -6, -2, 20, 0, 40); vein.bezierCurveTo(3, 20, 4, -6, 2, -38); vein.lineTo(-2, -38);
    g.add(part(vein, mat(C.leafLight), { depth: 4, bevel: 1.5, z: 20 }));
    const stem = rrect(6, 18, 3, 0, -52);
    g.add(part(stem, mat(C.forest), { depth: 8, bevel: 2, z: 2 }));
    g.rotation.z = -0.55;
    return g;
  },
  chili() {
    const g = new THREE.Group();
    const s = new THREE.Shape();
    s.moveTo(-30, 30); s.bezierCurveTo(-6, 34, 20, 20, 30, -6); s.bezierCurveTo(36, -24, 34, -40, 26, -50);
    s.bezierCurveTo(22, -36, 12, -18, -4, -6); s.bezierCurveTo(-16, 4, -30, 10, -36, 18); s.bezierCurveTo(-38, 24, -36, 29, -30, 30);
    g.add(new THREE.Mesh(gradient(extrude(s, 18, 7), [[0, 0xc8140d], [0.6, 0xe2231a], [1, 0xf0432a]]), mat(0xffffff, { vertexColors: true })));
    const cap = new THREE.Shape(); cap.moveTo(-40, 22); cap.bezierCurveTo(-42, 34, -30, 40, -22, 34); cap.bezierCurveTo(-24, 28, -30, 22, -40, 22);
    g.add(part(cap, mat(C.leaf), { depth: 16, bevel: 5, z: 2 }));
    const stem = new THREE.Shape(); stem.moveTo(-32, 34); stem.bezierCurveTo(-34, 42, -30, 50, -20, 54); stem.lineTo(-18, 50); stem.bezierCurveTo(-26, 46, -28, 40, -27, 34); stem.lineTo(-32, 34);
    g.add(part(stem, mat(C.forest), { depth: 7, bevel: 2.5, z: 6 }));
    return g;
  },
  mango() {
    const g = new THREE.Group();
    const s = new THREE.Shape();
    s.moveTo(-4, 40); s.bezierCurveTo(28, 44, 42, 12, 34, -16); s.bezierCurveTo(28, -40, 4, -50, -16, -42);
    s.bezierCurveTo(-36, -34, -40, -8, -34, 10); s.bezierCurveTo(-28, 28, -20, 38, -4, 40);
    const body = new THREE.Mesh(gradient(extrude(s, 28, 10), [[0, 0xf2b51c], [0.45, 0xf39a1e], [0.8, 0xe8501a], [1, 0xd8361a]]), mat(0xffffff, { vertexColors: true }));
    g.add(body);
    const leaf = new THREE.Shape(); leaf.moveTo(-4, 40); leaf.bezierCurveTo(4, 56, 26, 58, 34, 50); leaf.bezierCurveTo(24, 40, 8, 38, -4, 40);
    g.add(part(leaf, mat(C.leaf), { depth: 9, bevel: 3.5, z: 12 }));
    g.add(part(rrect(5, 14, 2.5, -6, 46), mat(C.forest), { depth: 6, bevel: 2, z: 12 }));
    return g;
  },
  bowl() {
    // a glazed katori (lathe-turned) heaped with dal
    const g = new THREE.Group();
    const prof = [[0, -36], [26, -34], [42, -22], [50, -4], [52, 4], [48, 6], [44, -4], [36, -18], [22, -28], [0, -30]].map(([x, y]) => new THREE.Vector2(x, y));
    g.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 72), mat(C.leaf, { side: THREE.DoubleSide })));
    const lentil = new THREE.SphereGeometry(5, 18, 12);
    const cols = [C.mango, 0xe8771b, C.turmeric, 0xd9541a];
    let i = 0;
    for (let r = 0; r <= 44; r += 8.5) {
      const n = Math.max(1, Math.round((2 * Math.PI * r) / 10));
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2 + r;
        const m = new THREE.Mesh(lentil, mat(cols[i++ % cols.length], { roughness: 0.45 }));
        m.scale.set(1, 0.6, 1);
        m.position.set(Math.cos(a) * r, 2 + 18 * (1 - (r / 48) ** 2), Math.sin(a) * r);
        m.rotation.set(a, k, 0);
        g.add(m);
      }
    }
    g.rotation.x = 0.42;
    return g;
  },
  bottle() {
    const g = new THREE.Group();
    const s = new THREE.Shape();
    s.moveTo(-10, 48); s.lineTo(10, 48); s.lineTo(10, 34); s.bezierCurveTo(10, 26, 28, 22, 28, 6);
    s.lineTo(28, -40); s.quadraticCurveTo(28, -48, 20, -48); s.lineTo(-20, -48); s.quadraticCurveTo(-28, -48, -28, -40);
    s.lineTo(-28, 6); s.bezierCurveTo(-28, 22, -10, 26, -10, 34); s.lineTo(-10, 48);
    g.add(part(s, mat(C.mango, { transmission: 0, roughness: 0.22 }), { depth: 26, bevel: 7 }));
    g.add(part(rrect(60, 32, 6, 0, -14), mat(C.cream), { depth: 4, bevel: 2, z: 30 }));
    g.add(part(circle(9, 0, -14), mat(C.leaf), { depth: 3, bevel: 1.5, z: 34 }));
    g.add(part(rrect(26, 14, 4, 0, 52), mat(C.leaf), { depth: 30, bevel: 3, z: -2 }));
    return g;
  },
  truck() {
    const g = new THREE.Group();
    g.add(part(rrect(64, 46, 6, -14, 6), mat(C.turmeric), { depth: 34, bevel: 4 }));
    const cab = new THREE.Shape(); cab.moveTo(20, -17); cab.lineTo(48, -17); cab.lineTo(48, 4); cab.lineTo(38, 20); cab.lineTo(20, 20); cab.lineTo(20, -17);
    g.add(part(cab, mat(C.leaf), { depth: 34, bevel: 4 }));
    const win = new THREE.Shape(); win.moveTo(26, 4); win.lineTo(40, 4); win.lineTo(34, 14); win.lineTo(26, 14); win.lineTo(26, 4);
    g.add(part(win, mat(C.cream), { depth: 3, bevel: 1.5, z: 38 }));
    g.add(part(circle(9, -26, 10), mat(C.chili), { depth: 3, bevel: 1.5, z: 38 }));
    g.add(part(circle(7, -8, 14), mat(C.leaf), { depth: 3, bevel: 1.5, z: 38 }));
    for (const x of [-26, 30]) {
      g.add(cyl(11, 10, mat(0x1f2a24, { roughness: 0.6, clearcoat: 0.3 }), x, -22, 36));
      g.add(cyl(5, 12, mat(C.cream), x, -22, 37));
    }
    return g;
  },
  clock() {
    const g = new THREE.Group();
    const ring = circle(44); ring.holes.push(holeCircle(36));
    g.add(part(ring, mat(C.leaf), { depth: 16, bevel: 5 }));
    g.add(part(circle(37), mat(C.cream), { depth: 8, bevel: 3, z: 2 }));
    g.add(part(rrect(7, 28, 3.5, 0, 12), mat(C.forest), { depth: 5, bevel: 2, z: 13 }));
    const minute = rrect(6, 24, 3, 0, 10); const mm = part(minute, mat(C.forest), { depth: 5, bevel: 2, z: 13 }); mm.rotation.z = -2.1; g.add(mm);
    g.add(cyl(5.5, 10, mat(C.chili), 0, 0, 17));
    for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2; g.add(sphere(i % 3 ? 1.8 : 3, mat(C.forest), Math.cos(a) * 29, Math.sin(a) * 29, 12)); }
    return g;
  },
  heart() {
    const g = new THREE.Group();
    const s = new THREE.Shape();
    s.moveTo(0, -42); s.bezierCurveTo(-30, -18, -46, 2, -46, 18); s.bezierCurveTo(-46, 36, -30, 46, -16, 46);
    s.bezierCurveTo(-6, 46, 0, 38, 0, 30); s.bezierCurveTo(0, 38, 6, 46, 16, 46); s.bezierCurveTo(30, 46, 46, 36, 46, 18);
    s.bezierCurveTo(46, 2, 30, -18, 0, -42);
    g.add(part(s, mat(C.chili), { depth: 22, bevel: 9 }));
    return g;
  },
  sparkle() {
    const g = new THREE.Group();
    const star = (r, R, cx, cy) => {
      const s = new THREE.Shape();
      s.moveTo(cx, cy + R); s.quadraticCurveTo(cx + r, cy + r, cx + R, cy); s.quadraticCurveTo(cx + r, cy - r, cx, cy - R);
      s.quadraticCurveTo(cx - r, cy - r, cx - R, cy); s.quadraticCurveTo(cx - r, cy + r, cx, cy + R);
      return s;
    };
    g.add(part(star(8, 42, -8, -6), mat(C.turmeric), { depth: 14, bevel: 5 }));
    g.add(part(star(4, 18, 32, 32), mat(C.mango), { depth: 10, bevel: 3, z: 6 }));
    g.add(part(star(3, 11, 34, -30), mat(C.chili), { depth: 8, bevel: 2.5, z: 6 }));
    return g;
  },
  badge() {
    const g = new THREE.Group();
    const ros = new THREE.Shape(); const n = 16;
    for (let i = 0; i <= n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2; const r = i % 2 ? 33 : 38; const x = Math.cos(a) * r, y = 8 + Math.sin(a) * r; i ? ros.lineTo(x, y) : ros.moveTo(x, y); }
    const tail = (dx) => { const s = new THREE.Shape(); s.moveTo(dx - 8, -6); s.lineTo(dx + 8, -6); s.lineTo(dx + 12 * Math.sign(dx), -50); s.lineTo(dx, -40); s.lineTo(dx - 12 * Math.sign(dx) * 0 - 2, -50); s.lineTo(dx - 8, -6); return s; };
    g.add(part(tail(-14), mat(C.chili), { depth: 8, bevel: 2.5, z: -4 }));
    g.add(part(tail(14), mat(C.chiliDeep), { depth: 8, bevel: 2.5, z: -4 }));
    g.add(part(ros, mat(C.turmeric), { depth: 14, bevel: 4 }));
    g.add(part(circle(24, 0, 8), mat(C.leaf), { depth: 6, bevel: 2.5, z: 15 }));
    const st = new THREE.Shape();
    for (let i = 0; i <= 10; i++) { const a = Math.PI / 2 + (i / 10) * Math.PI * 2; const r = i % 2 ? 6 : 14; const x = Math.cos(a) * r, y = 8 + Math.sin(a) * r; i ? st.lineTo(x, y) : st.moveTo(x, y); }
    g.add(part(st, mat(C.cream), { depth: 4, bevel: 1.8, z: 22 }));
    return g;
  },
  calendar() {
    const g = new THREE.Group();
    g.add(part(rrect(84, 80, 12, 0, -4), mat(C.cream), { depth: 14, bevel: 4 }));
    const top = new THREE.Shape(); top.moveTo(-42, 12); top.lineTo(42, 12); top.lineTo(42, 24); top.quadraticCurveTo(42, 36, 30, 36); top.lineTo(-30, 36); top.quadraticCurveTo(-42, 36, -42, 24); top.lineTo(-42, 12);
    g.add(part(top, mat(C.chili), { depth: 16, bevel: 4, z: 1 }));
    for (const x of [-20, 20]) g.add(cyl(4.5, 22, mat(C.forest), x, 40, 10, 0));
    let k = 0;
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
      const hot = k++ === 6;
      g.add(part(rrect(11, 9, 3, -24 + c * 16, -2 - r * 14), mat(hot ? C.turmeric : C.leaf), { depth: hot ? 6 : 3, bevel: 1.5, z: 18 }));
    }
    return g;
  },
  phone() {
    // classic handset glyph: one continuous C-shaped profile, extruded
    const s = new THREE.Shape();
    s.absarc(0, 0, 50, Math.PI * 0.12, Math.PI * 0.88, false);
    s.absarc(0, 0, 34, Math.PI * 0.88, Math.PI * 0.12, true);
    const g = new THREE.Group();
    g.add(part(s, mat(C.leaf), { depth: 18, bevel: 6 }));
    for (const dir of [-1, 1]) {
      const a = Math.PI * (dir < 0 ? 0.88 : 0.12);
      const cup = part(rrect(34, 24, 11), mat(C.leaf), { depth: 24, bevel: 7, z: -3 });
      cup.position.set(Math.cos(a) * 44 + dir * 4, Math.sin(a) * 44 - 14, 0);
      cup.rotation.z = dir * -0.35;
      g.add(cup);
      const grill = part(rrect(16, 6, 3), mat(C.forest), { depth: 3, bevel: 1.2, z: 27 });
      grill.position.copy(cup.position);
      grill.rotation.z = cup.rotation.z;
      g.add(grill);
    }
    g.rotation.z = 0.55;
    return g;
  },
  mail() {
    const g = new THREE.Group();
    g.add(part(rrect(92, 64, 10), mat(C.cream), { depth: 16, bevel: 4 }));
    const flap = new THREE.Shape(); flap.moveTo(-44, 26); flap.lineTo(0, -8); flap.lineTo(44, 26); flap.lineTo(40, 30); flap.lineTo(-40, 30); flap.lineTo(-44, 26);
    g.add(part(flap, mat(C.turmeric), { depth: 5, bevel: 2.5, z: 18 }));
    const heart = new THREE.Shape();
    heart.moveTo(0, -18); heart.bezierCurveTo(-9, -11, -13, -5, -13, 0); heart.bezierCurveTo(-13, 6, -8, 9, -4, 9); heart.bezierCurveTo(-1, 9, 0, 6, 0, 4);
    heart.bezierCurveTo(0, 6, 1, 9, 4, 9); heart.bezierCurveTo(8, 9, 13, 6, 13, 0); heart.bezierCurveTo(13, -5, 9, -11, 0, -18);
    g.add(part(heart, mat(C.chili), { depth: 5, bevel: 2.5, z: 25 }));
    return g;
  },
  check() {
    const g = new THREE.Group();
    g.add(part(circle(44), mat(C.leaf), { depth: 16, bevel: 6 }));
    const s = new THREE.Shape();
    s.moveTo(-22, 2); s.lineTo(-8, -14); s.lineTo(24, 20); s.lineTo(17, 27); s.lineTo(-8, 0); s.lineTo(-15, 9); s.lineTo(-22, 2);
    g.add(part(s, mat(C.cream), { depth: 6, bevel: 3, z: 20 }));
    return g;
  },
};

/* ---------- framing + render ---------- */
let current = null;
window.ICON_NAMES = Object.keys(ICONS);
window.renderIcon = (name) => {
  if (current) scene.remove(current);
  const icon = ICONS[name]();
  const pivot = new THREE.Group();
  pivot.add(icon);
  // centre and scale every model to the same visual size
  const box = new THREE.Box3().setFromObject(icon);
  const size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
  icon.position.sub(centre);
  const s = 150 / Math.max(size.x, size.y);
  pivot.scale.setScalar(s);
  // a gentle three-quarter turn shows the depth without losing legibility
  pivot.rotation.set(-0.22, 0.42, 0.02);
  scene.add(pivot);
  current = pivot;
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL("image/png");
};
window.READY = true;
</script>
</body>
</html>
